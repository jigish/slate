name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      # No Signing.local.xcconfig on CI: the app is ad-hoc signed.
      - name: Build Universal Release
        run: |
          xcodebuild -project Slate.xcodeproj -scheme Slate -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build build
          lipo build/Build/Products/Release/Slate.app/Contents/MacOS/Slate -verify_arch arm64 x86_64

      # Hardened Runtime library validation blocks loading an ad-hoc signed test bundle into the test host.
      - name: Test
        run: |
          xcodebuild -project Slate.xcodeproj -scheme Slate -destination 'platform=macOS' \
            -derivedDataPath build ENABLE_HARDENED_RUNTIME=NO test
